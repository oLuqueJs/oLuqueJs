<svg xmlns="http://www.w3.org/2000/svg" width="640" height="90" viewBox="0 0 640 90" role="img" aria-label="Hello, I’m Otávio">
  <style>
    @font-face { font-family: 'Newsreader'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
    text { font-family: 'Newsreader', Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 48px; fill: #c15f3c; }
    @media (prefers-color-scheme: dark) { text { fill: #e08a67; } }
    #reveal { animation: wipe 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) 0.2s forwards; }
    @keyframes wipe { to { width: 640px; } }
  </style>
  <defs><clipPath id="c"><rect id="reveal" x="0" y="0" width="0" height="90"/></clipPath></defs>
  <g clip-path="url(#c)"><text x="0" y="62">Hello, I’m Otávio ✨</text></g>
</svg>

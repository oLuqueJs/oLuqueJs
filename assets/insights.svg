<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-label="Quick insights: focus on Backend and DevOps, powered by coffee and Ritalin, github.com/oLuqueJs">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #c9d1d9; white-space: pre; }
    .label { fill: #8b949e; }
    .accent { fill: #79c0ff; }
    .row { opacity: 0; animation: up 0.6s ease-out forwards; }
    .r1 { animation-delay: 0.2s; }
    .r2 { animation-delay: 0.5s; }
    .r3 { animation-delay: 0.8s; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <rect x="0.5" y="0.5" width="559" height="169" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="4" height="169" rx="2" fill="#c15f3c"/>

  <g class="row r1">
    <text x="28" y="48">🔭</text>
    <text x="64" y="48" class="label">Focus</text>
    <text x="170" y="48">Backend &amp; DevOps · learning new tech</text>
  </g>
  <line x1="28" y1="68" x2="532" y2="68" stroke="#21262d"/>

  <g class="row r2">
    <text x="28" y="98">☕️</text>
    <text x="64" y="98" class="label">Powered by</text>
    <text x="170" y="98">Coffee &amp; Ritalin ~</text>
  </g>
  <line x1="28" y1="118" x2="532" y2="118" stroke="#21262d"/>

  <g class="row r3">
    <text x="28" y="148">🌐</text>
    <text x="64" y="148" class="label">Socials</text>
    <text x="170" y="148" class="accent">github.com/oLuqueJs</text>
  </g>
</svg>
